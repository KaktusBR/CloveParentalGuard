name: Release

# Push a tag like v1.0.0 to build CloveParentalGuard.exe and attach it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/CloveParentalGuard.Core.Tests -c Release

      - name: Build CloveParentalGuard.exe
        shell: pwsh
        run: ./install/Build-CloveParentalGuard.ps1

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" publish/CloveParentalGuard.exe --generate-notes --title "${{ github.ref_name }}"
